<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 {
            color: #1a1a1a;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .password-container {
            position: relative;
            background-color: #f7f9fa;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.25rem;
            word-break: break-all;
            margin-bottom: 20px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-action {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn-action:hover {
            background-color: #0056b3;
        }
        .controls {
            text-align: left;
ss="subtitle">Crie senhas fortes e seguras em segundos</p>
        </header>

        <!-- Exibição da senha -->
        <div class="password-wrapper">
            <div class="password-display" id="passwordOutput">
                <span class="placeholder">Clique em "Gerar"</span>
            </div>
            <button class="btn-copy" id="copyBtn" title="Copiar senha">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
        </div>

        <!-- Botão gerar -->
        <button class="btn-generate" id="generateBtn">⚡ Gerar Senha</button>

        <!-- Controles -->
        <div class="controls">
            <!-- Tamanho da senha -->
            <div class="control-group">
                <label for="lengthSlider">Comprimento: <span id="lengthDisplay">12</span></label>
                <div class="length-control">
                    <button class="btn-counter" id="decrementBtn">−</button>
                    <input type="range" id="lengthSlider" min="4" max="32" value="12" />
                    <button class="btn-counter" id="incrementBtn">+</button>
                </div>
            </div>

            <!-- Opções de caracteres -->
            <div class="control-group">
                <label>Tipo de caracteres:</label>
                <div class="toggle-grid">
                    <button class="toggle-btn active" data-option="emoji">😊 Emojis</button>
                    <button class="toggle-btn active" data-option="upper">🔠 Maiúsculas</button>
                    <button class="toggle-btn active" data-option="lower">🔡 Minúsculas</button>
                    <button class="toggle-btn active" data-option="number">🔢 Números</button>
                    <button class="toggle-btn active" data-option="symbol">🔣 Símbolos</button>
                    <button class="toggle-btn" data-option="exclude">🚫 Evitar ambíguos</button>
                </div>
            </div>
        </div>

        <!-- Indicador de força -->
        <div class="strength-container">
            <div class="strength-header">
                <span class="strength-label">Força da senha</span>
                <span class="strength-text" id="strengthText">—</span>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Rodapé -->
        <footer class="footer">
            <p>💡 Dica: Quanto mais opções, mais forte a senha!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
